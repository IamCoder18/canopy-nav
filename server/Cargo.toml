[package]
name = "canopy-packserver"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "packserver"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
osmpbf = "0.3"
flate2 = "1"
tar = "0.4"
walkdir = "2"
fs2 = "0.4"
geo = "0.32"
rstar = "0.12"
tempfile = "3"
thiserror = "2"
http-body-util = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body = "1"
