name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

      # End-to-end: drives the real built app in headless Chrome through
      # import -> offline search -> route -> navigate -> regions. This is the
      # only check that exercises the worker, region store, router and screens
      # together, so a wiring regression can't slip past unit tests.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # .osm.pbf is what Geofabrik publishes, so it is the primary path; both
      # are exercised against the real file picker.
      - name: Build .osm.pbf fixture
        run: node tools/osm2pbf.mjs test/fixture.osm test/fixture.osm.pbf 700

      - name: End-to-end smoke test (.osm)
        run: |
          npx vite preview --port 4192 --host &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4192/ >/dev/null && break
            sleep 1
          done
          node test/e2e.mjs

      - name: End-to-end smoke test (.osm.pbf)
        run: node test/e2e.mjs
        env:
          E2E_FIXTURE: fixture.osm.pbf

      # Every screen at phone-portrait, phone-landscape and head-unit sizes,
      # asserting no horizontal overflow and no invisible text.
      - name: Screen coverage at three viewports
        run: node test/screens.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots/
