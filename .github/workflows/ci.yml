name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: All gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # End-to-end drives the real built app in headless Chromium through
      # import -> offline search -> route -> navigate -> regions. That is the
      # only check exercising the worker, region store, router and screens
      # together, so a wiring regression can't slip past unit tests.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Every gate, in one list — `tools/verify.mjs`, the same file `npm run
      # verify` runs locally. It used to be spelled out here step by step,
      # which is how the reflow, textscale and ui-audit gates came to exist on
      # developers' machines and not in CI: two lists of gates drift, and the
      # one nobody re-reads is the one that loses one. The distinctive steps
      # this file used to carry are all in there now — the ratcheted lint, the
      # bundle budget, the .osm.pbf fixture rebuild and its staleness check,
      # both end-to-end passes (`.osm` and the `.osm.pbf` that Geofabrik
      # publishes), and the three-viewport screen run that once connected to
      # the wrong port and failed every build with ERR_CONNECTION_REFUSED
      # before both were pinned to 4192.
      - name: All gates
        run: npm run verify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots/
