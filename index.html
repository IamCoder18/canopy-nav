<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Pinch-zoom is deliberately left enabled.
      It was `user-scalable=no, maximum-scale=1.0`, which fails WCAG 1.4.4
      (Resize Text) and 1.4.10 (Reflow): at 200% zoom "Exit navigation" measured
      180px off-screen and `overflow: hidden` clipped three of the four round
      buttons. A user who needs magnification is not a case to design around.
      A car windscreen is fixed, so the app also sets its own pan/zoom limits in
      MapView rather than relying on the browser to forbid the gesture.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- Matches the AAOS +1 elevation surface the app chrome sits on, so the
         status bar and the WebView's own background do not flash a different
         shade between the native shell painting and React mounting. -->
    <meta name="theme-color" content="#0E1013" />
    <meta name="description" content="Offline car navigation from OpenStreetMap data, with an Android Auto interface." />
    <!-- Absent before: every launch logged a 404 for /favicon.ico, which is noise
         in a WebView logcat and hides real errors. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Canopy Nav</title>
    <style>
      /* Painted before the stylesheet resolves, so a cold start in a WebView is
         the app's own surface rather than white. */
      html, body { margin: 0; height: 100%; background: #0E1013; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <!-- Without JS there is no app, and saying so beats a blank page. -->
      <p style="color:#DADCE0;font:16px system-ui,sans-serif;padding:24px">
        Canopy Nav needs JavaScript to run.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
